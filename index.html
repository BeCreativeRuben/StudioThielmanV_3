    <title>Studio Thielman | Professional Websites Starting at €25/month</title>

    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    <link rel="dns-prefetch" href="https://www.google-analytics.com" />
    <link rel="dns-prefetch" href="https://business.tinrate.com" />

    <!-- Google Consent Mode v2 (advanced) + GA4 -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

      // Read persisted choice early so returning visitors don't get tracked
      // before React can run consent updates.
      var stConsentChoice = null;
      try { stConsentChoice = localStorage.getItem('st_cookie_consent_v1'); } catch (e) {}

      var analyticsDefault = (stConsentChoice === 'reject') ? 'denied' : 'granted';
      var adsDefault = (stConsentChoice === 'accept') ? 'granted' : 'denied';
      // Functional/preferences storage (used by the Tinrate embed extras). Opt-in, same as ads.
      var prefsDefault = (stConsentChoice === 'accept') ? 'granted' : 'denied';

      gtag('consent', 'default', {
        // Default: analytics allowed (unless user previously rejected); ads and preferences denied (unless user accepted)
        'analytics_storage': analyticsDefault,
        'ad_storage': adsDefault,
        'ad_user_data': adsDefault,
        'ad_personalization': adsDefault,
        'functionality_storage': prefsDefault,
        'personalization_storage': prefsDefault,
        // Allow banner to update quickly on first load
        'wait_for_update': 500
      });
    </script>
    <script>
      // Commands queue in dataLayer; gtag.js picks them up when it loads after the page (see below).
      gtag('js', new Date());
      gtag('config', 'G-RVLESW1G3L');
    </script>

    <!--
      Third parties load after the page has rendered (window load + idle, max ~2.5s) so they never
      compete with the first paint. Consent defaults above are already in dataLayer before either loads.
      Tinrate pill: always visible; extras wait for preferences consent (functionality + personalization storage).
    -->
    <script>
      (function () {
        var started = false;
        function add(src, attrs) {
          var s = document.createElement("script");
          s.async = true;
          s.src = src;
          for (var k in attrs) s.setAttribute(k, attrs[k]);
          (document.head || document.documentElement).appendChild(s);
        }
        function loadThirdParties() {
          if (started) return;
          started = true;
          add("https://www.googletagmanager.com/gtag/js?id=G-RVLESW1G3L", {});
          add("https://business.tinrate.com/embed/pill.js", {
            "data-tinrate-embed": "zTvzwgbZsXM0",
            "data-tinrate-show": "always",
            "data-tinrate-consent": "preferences"
          });
        }
        function schedule() {
          if ("requestIdleCallback" in window) window.requestIdleCallback(loadThirdParties, { timeout: 2500 });
          else window.setTimeout(loadThirdParties, 1200);
        }
        if (document.readyState === "complete") schedule();
        else window.addEventListener("load", schedule, { once: true });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
